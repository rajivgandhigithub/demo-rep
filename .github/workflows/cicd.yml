name: Java DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  devsecops:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Unit Tests
      run: mvn clean test

    - name: SonarCloud Code Scan
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        mvn sonar:sonar           -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}           -Dsonar.organization=${{ secrets.SONAR_ORG_KEY }}           -Dsonar.host.url=https://sonarcloud.io

    - name: Trivy Filesystem Scan
      uses: aquasecurity/trivy-action@0.28.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        severity: 'HIGH,CRITICAL'

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build & Tag Container
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ github.sha }} .
        docker tag ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest

    - name: Trivy Container Image Scan
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ github.sha }}'
        format: 'table'
        severity: 'HIGH,CRITICAL'

    - name: Push Container to Hub
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ github.sha }}
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest

    - name: Update Manifest & Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        sed -i 's|image: .*|image: '${{ secrets.DOCKERHUB_USERNAME }}'/my-app:'${{ github.sha }}'|g' k8s/deployment.yaml
        git add k8s/deployment.yaml
        git commit -m "chore: bump image tag to ${{ github.sha }} [skip ci]"
        git push origin main
